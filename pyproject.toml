[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-control-demo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "httpx>=0.28,<1", "sqlalchemy>=2.0,<3", "alembic>=1.15,<2", "numpy>=2.2,<3", "mcp>=1.9,<2", "python-multipart>=0.0.32", "python-docx==1.2.0", "openpyxl==3.1.5", "pypdf==6.21.1", "defusedxml==0.7.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["apps*", "packages*", "examples*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
